<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>俺の理科教材</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <div class="container">
      <p class="site-name"><a href="index.html">俺の理科教材</a></p>
      <nav class="site-nav" aria-label="サイト内">
        <ul>
          <li><a href="index.html#materials" aria-current="page">教材一覧</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="hero">
      <div class="container">
        <div>
          <h1 class="hero-title">Science in Motion</h1>
          <p class="hero-lead">見えないしくみを、動かして確かめる。</p>
        </div>
        <!-- 飾りの図：光が鏡で反射して目に届き、鏡の奥に像が見える -->
        <svg class="hero-figure" viewBox="0 0 420 280" aria-hidden="true" focusable="false">
          <!-- 鏡 -->
          <rect x="237" y="20" width="6" height="240" fill="#a9c8ec"/>
          <line x1="240" y1="20" x2="240" y2="260" stroke="#2f6fb0" stroke-width="1.5"/>
          <!-- 目から像へのばした点線（像は鏡の奥に見える） -->
          <line class="ray-virtual" x1="240" y1="140" x2="400" y2="40" stroke="#8fa7bf" stroke-width="2" stroke-dasharray="7 6"/>
          <circle class="ray-virtual" cx="400" cy="40" r="7" fill="none" stroke="#8fa7bf" stroke-width="2"/>
          <!-- 光の道筋：物体 → 鏡 → 目 -->
          <polyline class="ray" pathLength="1" points="80,40 240,140 80,240" fill="none" stroke="var(--color-light)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- 物体と目 -->
          <circle cx="80" cy="40" r="8" fill="var(--color-light)"/>
          <circle cx="240" cy="140" r="5" fill="var(--color-light)"/>
          <circle cx="80" cy="240" r="8" fill="#16263a"/>
        </svg>
      </div>
    </div>

    <section class="section container" id="materials">
      <h2 class="section-title">
        <span class="en">Materials</span>
        <span class="ja">学年を選ぶ</span>
      </h2>
      <ul class="tile-list">
        <li><a class="tile" href="grade1.html"><span class="tile-title">中学1年</span><span class="tile-meta">教材 1件</span></a></li>
        <li><a class="tile" href="grade2.html"><span class="tile-title">中学2年</span><span class="tile-meta">教材 1件</span></a></li>
        <li><a class="tile" href="grade3.html"><span class="tile-title">中学3年</span><span class="tile-meta">教材 1件</span></a></li>
      </ul>
    </section>

    <section class="section container">
      <h2 class="section-title">
        <span class="en">About</span>
        <span class="ja">このサイトについて</span>
      </h2>
      <div class="prose">
        <p>授業のために作った、理科のシミュレーション教材を公開しています。ブラウザだけで動くので、タブレットやパソコンからそのまま使えます。</p>
        <p>だれでも読みやすく、操作しやすいように、色や文字、ボタンのルールを決めて作っています。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 俺の理科教材</p>
    </div>
  </footer>
</body>
</html>
