<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{単元名}}｜さわってうごく理科教材</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="appbar">
    <div class="appbar-inner">
      <a class="appbar-back" href="grade{{N}}.html" aria-label="中学{{N}}年の教材にもどる"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <p class="logo"><a href="index.html">さわってうごく理科教材</a></p>
      <!-- この教材の学年のリンクに aria-current="true" を付ける -->
      <nav class="tabbar" aria-label="学年">
        <ul>
          <li><a href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>ホーム</span></a></li>
          <li><a href="grade1.html"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16.6" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="'Noto Sans JP', sans-serif">1</text></svg><span>1年</span></a></li>
          <li><a href="grade2.html"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16.6" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="'Noto Sans JP', sans-serif">2</text></svg><span>2年</span></a></li>
          <li><a href="grade3.html"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16.6" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="'Noto Sans JP', sans-serif">3</text></svg><span>3年</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <nav class="breadcrumb" aria-label="現在位置">
      <ol>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="grade{{N}}.html">中学{{N}}年</a></li>
        <li><span aria-current="page">{{単元名}}</span></li>
      </ol>
    </nav>

    <div class="page-head">
      <ul class="chips" aria-label="分野と学年"><li class="chip field-{{field}}">{{分野}}</li><li class="chip">中学{{N}}年</li></ul>
      <h1 class="page-title">{{単元名}}</h1>
      <p class="lead">{{何を動かして、何を確かめるか（1文。〜しよう）}}</p>
    </div>

    <div class="sim-layout">
      <section class="card sim-stage" aria-label="シミュレーション">
        <canvas id="board" class="sim-canvas" width="600" height="360" role="img"
            aria-label="{{図に何が描かれていて、操作すると何が変わるか}}"></canvas>
        <div class="guide">
          <span class="guide-icon"><svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="24" y="6" width="16" height="22" rx="3" fill="#fff" stroke="#1b1b2f" stroke-width="3"/><rect x="20" y="3" width="24" height="7" rx="3.5" fill="#fff" stroke="#1b1b2f" stroke-width="3"/><circle cx="32" cy="42" r="18" fill="#fff"/><path d="M14.4 46A18 18 0 0 0 49.6 46Z" fill="#7fd3ff"/><circle cx="32" cy="42" r="18" fill="none" stroke="#1b1b2f" stroke-width="3"/><circle cx="25.5" cy="37.5" r="2.6" fill="#1b1b2f"/><circle cx="38.5" cy="37.5" r="2.6" fill="#1b1b2f"/><path d="M27.5 43q4.5 4 9 0" fill="none" stroke="#1b1b2f" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="21.5" cy="42.5" rx="2.6" ry="1.8" fill="#ff8fbf"/><ellipse cx="42.5" cy="42.5" rx="2.6" ry="1.8" fill="#ff8fbf"/><circle cx="26" cy="52" r="1.8" fill="#fff"/><circle cx="36" cy="54.5" r="1.3" fill="#fff"/></svg></span>
          <p id="msg" class="notice" aria-live="polite">{{最初に何をすればよいか}}</p>
        </div>
      </section>

      <div class="card panel">
        <h2 class="panel-title">条件を変える</h2>
        <div class="control">
          <label class="control-label" for="aSlider">{{量の名前}} <span class="control-value"><span id="aValue">{{初期値}}</span> {{単位}}</span></label>
          <input type="range" id="aSlider" min="{{最小}}" max="{{最大}}" step="{{きざみ}}" value="{{初期値}}">
        </div>
        <div class="panel-actions">
          <!-- 塗りのボタンは1つだけ（例：スタート）。もとに戻すはテキストボタン -->
          <button id="resetBtn" class="btn btn-tertiary btn-block">もとに戻す</button>
        </div>
      </div>
    </div>

    <div class="info">
      <details class="accordion" open>
        <summary>使い方</summary>
        <div class="accordion-body">
          <ol class="steps">
            <li>{{手順1}}</li>
            <li>{{手順2}}</li>
            <li>{{手順3：条件を変えて比べる}}</li>
          </ol>
        </div>
      </details>
      <details class="accordion">
        <summary>このモデルについて</summary>
        <div class="accordion-body prose">
          <p>{{単純にしたところと、実際との違い}}</p>
        </div>
      </details>
    </div>
  </main>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const aSlider = document.getElementById('aSlider');
  const aValue = document.getElementById('aValue');
  const resetBtn = document.getElementById('resetBtn');

  // キャンバスで使う文字（ページと同じ書体）
  const FONT = '"Noto Sans JP", sans-serif';

  // 高解像度の画面（タブレットなど）でもくっきり見えるように、画素を細かくする。
  // 図は W × H の大きさを基準に描く（canvas.width は使わない）。
  const W = canvas.width;
  const H = canvas.height;
  const RATIO = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * RATIO;
  canvas.height = H * RATIO;
  canvas.dataset.w = W;
  canvas.dataset.h = H;
  ctx.setTransform(RATIO, 0, 0, RATIO, 0, 0);

  // 動きを減らす設定の人には、演出の動きを出さない（結果はそのまま見せる）
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ふきだしで話す。cheer が true なら、フラスコがよろこぶ
  function say(text, cheer) {
    msg.textContent = text;
    msg.classList.remove('pop');
    void msg.offsetWidth;          // いったん描き直させて、動きを最初からにする
    msg.classList.add('pop');
    if (cheer) {
      const icon = document.querySelector('.guide-icon');
      icon.classList.remove('cheer');
      void icon.offsetWidth;
      icon.classList.add('cheer');
    }
  }


  // 色（ほかの教材とそろえる）
  const INK = '#1a2533';  // 文字
  const LINE = '#7f93a8'; // 線

  // 画面全体を描き直す
  function draw() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // {{ここに図を描く}}
    ctx.fillStyle = INK;
    ctx.font = '500 18px ' + FONT;
    ctx.fillText('{{図の中の文字}}', 20, 30);
  }

  // スライダーを動かしたら、数値の表示を変えて描き直す
  aSlider.addEventListener('input', function () {
    aValue.textContent = aSlider.value;
    draw();
  });

  // もとに戻す
  resetBtn.addEventListener('click', function () {
    aSlider.value = aSlider.defaultValue;
    aValue.textContent = aSlider.value;
    say('{{最初に何をすればよいか}}');
    draw();
  });

  // 最初の状態を描き、図で使う文字のフォントが読み込めたら描き直す
  // （キャンバスの文字は、描くまでフォントが読み込まれないため）
  draw();
  document.fonts.load('500 18px ' + FONT, '{{図の中で使う文字をすべて}}').finally(draw);
</script>

  <footer class="site-footer">
    <p>© 2026 さわってうごく理科教材</p>
  </footer>
</body>
</html>
